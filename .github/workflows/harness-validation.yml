name: Harness Validation
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Isolated unit and CLI integration tests
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python harness/runner/run_tests.py --output test-results/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-results-${{ matrix.os }}
          path: test-results/
