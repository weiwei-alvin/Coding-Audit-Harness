<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>合成收集器 fixture：服務連線面板</title>
<style>
  :root { --ink: #1c1f26; --line: #c9ccd4; --surface: #f7f7f8; }
  body { margin: 0; padding: 24px; font-family: "Sora", system-ui, sans-serif; color: var(--ink); background: var(--surface); }
  form { display: grid; gap: 12px; max-width: 28rem; }
  label { font-weight: 600; }
  input { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; }
  button { font: inherit; justify-self: start; padding: 8px 16px; border: 1px solid var(--line); border-radius: 8px; background: #ffffff; cursor: pointer; }
  ul { max-width: 28rem; padding-left: 20px; }
</style>
</head>
<body>
<main>
  <h1>服務連線面板</h1>
  <form id="probe-form">
    <label for="host">主機位址</label>
    <input id="host" name="host" type="text" autocomplete="off" placeholder="127.0.0.1">
    <button type="submit">執行連線測試</button>
  </form>
  <p id="status" role="status" aria-live="polite">尚未執行測試。</p>
  <section>
    <h2>最近結果</h2>
    <ul id="results">
      <li>127.0.0.1 — 通過（合成資料）</li>
    </ul>
  </section>
</main>
<script>
  document.getElementById("probe-form").addEventListener("submit", function (event) {
    event.preventDefault();
    var host = document.getElementById("host").value.trim() || "127.0.0.1";
    document.getElementById("status").textContent = host + "：連線通過（合成結果）。";
  });
</script>
</body>
</html>
